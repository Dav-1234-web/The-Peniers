<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback | The Peniers Bookstore</title>

<style>

*{margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif;}

body{background:#fff6f1;}

.container{
    width:92%;
    max-width:520px;
    margin:60px auto;
}

.card{
    background:white;
    padding:35px;
    border-radius:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

h1{color:#1a1420; margin-bottom:6px;}

.subtext{color:#8a7a76; margin-bottom:22px; font-size:14px;}

label{display:block; margin-top:15px; font-weight:bold; font-size:14px;}

select, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:1px solid #e4d5cd;
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
}

textarea{resize:vertical;}

button{
    margin-top:22px;
    width:100%;
    padding:14px;
    background:#ff3d26;
    color:white;
    border:none;
    font-size:15px;
    font-weight:bold;
    border-radius:8px;
    cursor:pointer;
}

.flash{
    padding:12px 15px;
    border-radius:8px;
    margin-bottom:18px;
    font-weight:600;
    font-size:14px;
}

.flash.success{background:#d4edda; color:#155724;}
.flash.error{background:#f8d7da; color:#721c24;}

.back-link{
    display:inline-block;
    margin-top:18px;
    color:#ff3d26;
    text-decoration:none;
    font-weight:700;
    font-size:13.5px;
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Feedback &amp; Bug Reports</h1>
        <p class="subtext">Something not working right, or just want to tell us something? Let us know below.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <label>What is this about?</label>
            <select name="feedback_type">
                <option value="Bug Report">Report a Bug</option>
                <option value="Comment">General Comment</option>
            </select>

            <label>Your Message</label>
            <textarea name="message" rows="5" placeholder="Tell us what happened or what's on your mind..." required></textarea>

            <button type="submit">Send Feedback</button>

        </form>

        <a class="back-link" href="/">&larr; Back to Home</a>

    </div>

</div>

</body>
</html>
