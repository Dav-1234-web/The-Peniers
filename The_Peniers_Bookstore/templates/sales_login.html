<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Peniers - Sales Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #0c1422;
        }

        .login-box {
            width: 390px;
            padding: 35px;
            border-radius: 16px;
            background: #172235;
            box-shadow: 0 20px 50px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            color: #f3bd45;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #aeb8c8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: white;
            margin: 15px 0 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #45536a;
            background: #101a2a;
            color: white;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #f3bd45;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffd36d;
        }

        .error {
            padding: 10px;
            border-radius: 7px;
            background: #632b2b;
            color: #fff;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        THE PENIERS
    </div>

    <div class="subtitle">
        Sales Dashboard
    </div>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="@thepeniers"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            LOGIN
        </button>

    </form>

</div>

</body>
</html>
